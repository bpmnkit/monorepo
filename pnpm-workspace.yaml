packages:
  - packages/*
  - apps/*
  - plugins-cli/*

# pnpm 11 removed the `onlyBuiltDependencies` allowlist: every dependency that
# ships a build script now needs an explicit yes or no here, and an unanswered
# one fails the install. The three that were never on the old allowlist are
# answered `false`, which is the behaviour they already had.
allowBuilds:
  '@biomejs/biome': true
  better-sqlite3: true
  esbuild: true
  isolated-vm: true
  sharp: true
  workerd: true
  # Marketplace publishing tooling; the signing binary is only needed by `vsce publish`.
  '@vscode/vsce-sign': false
  # Native keychain binding pulled in by the VS Code extension tooling — unused here.
  keytar: false

# pnpm 12 holds a freshly published version back by default. `docspack` 1.2.0 is
# the release that discovers `@<vendor>/<name>-docspack`, which is what makes
# `@bpmnkit/camunda-docspack` reachable from the upstream CLI at all, and it went
# out the same day. These three are named here to take it now rather than waiting
# the cooling-off period out. Drop the exclusions once the versions have aged
# past it.
minimumReleaseAgeExclude:
  - '@docspack/lapis@0.2.0'
  - '@docspack/openapi@0.2.0'
  - docspack@1.2.0

patchedDependencies:
  '@preact/signals-react@2.3.0': patches/@preact__signals-react@2.3.0.patch
