name: Camunda docspack

# Rebuilds @bpmnkit/camunda-docspack from the current camunda-docs `docs/` tree.
#
# Weekly rather than nightly, and not because the build is slow — it reads repository source
# directly and never runs Docusaurus, so the shallow clone dominates. Weekly batches the 8-12
# upstream commits that touch this corpus in a week into one reviewable diff, and staleness
# never exceeds seven days. `workflow_dispatch` covers picking up a Camunda release the same day.
#
# It opens a pull request rather than publishing: releases go through changesets, and a
# documentation corpus that republished itself unattended is exactly the thing nobody reviews.

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    name: Rebuild pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout camunda-docs
        uses: actions/checkout@v4
        with:
          repository: camunda/camunda-docs
          path: .camunda-docs
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Pinned rather than lts/*: the build asserts that the same upstream commit produces the
      # same bytes, and a Node minor that changes ICU or object ordering would break that.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter @bpmnkit/camunda-docspack

      - name: Record upstream revision
        id: upstream
        run: echo "sha=$(git -C .camunda-docs rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build pack
        run: node packages/camunda-docspack/dist/cli.js --camunda-docs .camunda-docs

      - name: Check the build is reproducible
        run: |
          cp -r packages/camunda-docspack/.llms /tmp/llms-first
          node packages/camunda-docspack/dist/cli.js --camunda-docs .camunda-docs
          diff -r /tmp/llms-first packages/camunda-docspack/.llms

      - name: Test
        run: pnpm turbo test --filter @bpmnkit/camunda-docspack

      - name: Check package metadata
        run: node scripts/check-packages.mjs

      # A renamed upstream heading renames a chunk, which breaks anything pinning that id. A
      # content-only change is routine; a departed id is worth a human reading the diff.
      - name: Report departed chunk ids
        run: |
          git diff --name-only -- packages/camunda-docspack/.llms/chunks \
            | grep -E '^packages/camunda-docspack/\.llms/chunks/' > /tmp/changed.txt || true
          echo "chunk files changed: $(wc -l < /tmp/changed.txt)"
          git diff --diff-filter=D --name-only -- packages/camunda-docspack/.llms/chunks \
            | sed 's|.*/||;s|\.md$||' > /tmp/departed.txt || true
          if [ -s /tmp/departed.txt ]; then
            echo "::warning::chunk ids removed by this rebuild:"
            cat /tmp/departed.txt
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/camunda-docspack-rebuild
          commit-message: "chore(camunda-docspack): rebuild against camunda-docs@${{ steps.upstream.outputs.sha }}"
          title: "chore(camunda-docspack): rebuild against camunda-docs@${{ steps.upstream.outputs.sha }}"
          body: |
            Weekly rebuild of `@bpmnkit/camunda-docspack` from
            [camunda/camunda-docs@${{ steps.upstream.outputs.sha }}](https://github.com/camunda/camunda-docs/commit/${{ steps.upstream.outputs.sha }}).

            Generated by `.github/workflows/camunda-docspack.yml`. The build is deterministic and
            was verified to produce identical bytes twice in this run.

            Check the job log for departed chunk ids before merging — a renamed upstream heading
            renames a chunk, and anything pinning the old id stops resolving.

            Add a changeset if this should reach npm.
          add-paths: |
            packages/camunda-docspack/.llms
            packages/camunda-docspack/llms.txt
            packages/camunda-docspack/NOTICE
